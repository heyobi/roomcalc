name: iOS → TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'ios-testflight' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEAM_ID: U99V9TSK2X
  BUNDLE_ID: com.heyobi.roomcalc
  PROFILE_NAME: Roomcalc CI AppStore

jobs:
  check:
    name: Typecheck, test, build web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

  webkit:
    # The production build must work in WebKit (the iOS engine) with no network: rooms, every material,
    # the shopping list, persistence, metric and imperial. Nothing ships otherwise.
    name: App in WebKit
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: End-to-end check in WebKit (network blocked)
        run: |
          npx vite preview --port 4183 --strictPort &
          npx wait-on -t 30000 http://localhost:4183 || sleep 5
          APP_URL='http://localhost:4183/?selftest&scan' node tests/webkit/app.mjs

  prepare:
    name: Check App Store Connect
    needs: [check, webkit]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Check required secrets
        env:
          C: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P: ${{ secrets.P12_PASSWORD }}
          K: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY C P K; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see README)"; exit 1; fi
      - name: Ensure bundle ID and app record
        id: app
        run: node scripts/asc.cjs ensure-app
      - name: Next build number
        id: build
        run: node scripts/asc.cjs next-build-number "${{ steps.app.outputs.app_id }}" "${{ github.run_number }}"

  build:
    name: Build & upload to TestFlight
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build web app and sync into the iOS project
        run: npm run build && npx cap sync ios

      - name: Install Apple Distribution certificate
        id: cert
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          node -e "
            let raw = (process.env.BUILD_CERTIFICATE_BASE64 || '').trim();
            raw = raw.replace(/^BUILD_CERTIFICATE_BASE64\s*=\s*/i, '').replace(/^[\"']|[\"']$/g, '').replace(/\s+/g, '');
            require('fs').writeFileSync(process.argv[1], Buffer.from(raw, 'base64'));
          " "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CLEAN_PASS=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CLEAN_PASS" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          SERIAL=$(security find-certificate -a -c "Apple Distribution" -p "$KEYCHAIN_PATH" | openssl x509 -noout -serial | cut -d= -f2)
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"

      - name: Create / fetch provisioning profile
        id: profile
        run: node scripts/asc.cjs profile "${{ steps.cert.outputs.serial }}" "$PROFILE_NAME"

      - name: Configure manual signing
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
        run: node scripts/configure-signing.cjs

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive | tail -n 120

      - name: Export signed IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa | tail -n 60
          ls -lh build/ipa/

      - name: Upload to App Store Connect (TestFlight)
        run: |
          node -e "
            const fs = require('fs'), path = require('path'), os = require('os');
            let raw = (process.env.ASC_PRIVATE_KEY || '').trim().replace(/^[\"']|[\"']$/g, '');
            raw = raw.replace(/\\\\n/g, '\n').trim() + '\n';
            const d = path.join(os.homedir(), '.appstoreconnect', 'private_keys');
            fs.mkdirSync(d, { recursive: true });
            fs.writeFileSync(path.join(d, 'AuthKey_' + process.env.ASC_KEY_ID + '.p8'), raw);
          "
          IPA_PATH=$(find build/ipa -name "*.ipa" | head -n 1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --show-progress
          echo "### Build $BUILD_NUMBER uploaded to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys
