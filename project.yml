# XcodeGen spec. CI runs `xcodegen generate` to create Roomcalc.xcodeproj (not checked in).
name: Roomcalc
options:
  bundleIdPrefix: com.heyobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Roomcalc:
    type: application
    platform: iOS
    sources:
      - Roomcalc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.roomcalc
        PRODUCT_NAME: Roomcalc
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Roomcalc/Info.plist
      properties:
        CFBundleDisplayName: Roomcalc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Roomcalc uses the camera and LiDAR sensor to scan the room and measure its walls, doors and windows. Nothing is recorded or sent anywhere.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  RoomcalcTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RoomcalcTests
    dependencies:
      - target: Roomcalc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.roomcalc.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Roomcalc.app/Roomcalc
        BUNDLE_LOADER: $(TEST_HOST)
  RoomcalcUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RoomcalcUITests
    dependencies:
      - target: Roomcalc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.roomcalc.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Roomcalc
schemes:
  Roomcalc:
    build:
      targets:
        Roomcalc: all
        RoomcalcTests: [test]
        RoomcalcUITests: [test]
    test:
      targets:
        - RoomcalcTests
        - RoomcalcUITests
    archive:
      config: Release
